<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dotfield</title>
<meta name="theme-color" content="#f3f3f1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<script>
  try {
    var s = JSON.parse(localStorage.getItem("dotfield:v1") || "{}"), m = s.theme || "auto";
    var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if (new URLSearchParams(location.search).has("display")) document.documentElement.classList.add("display");
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Instrument+Serif:ital@0;1&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<div id="skeleton" aria-busy="true" aria-label="読み込み中">
  <div class="sk-dots"></div>
  <div class="sk sk-brand"></div>
  <div class="sk sk-clock"></div>
  <div class="sk sk-dock">
    <em></em><i></i>
    <span></span><span></span><span></span><span></span><span></span><span></span><b></b>
  </div>
</div>

<div id="ui">
  <div class="brand glass" data-enter style="--d:0">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="brand-name">Dotfield</span>
  </div>

  <div class="clock-chip glass" id="clockChip" data-enter style="--d:1"><span id="clockHM">00:00</span><span id="clockS" class="sec">00</span></div>

  <nav class="dock glass" id="dock" data-enter style="--d:2" aria-label="コントロール">
    <button class="scene-chip" id="btnScenes" data-tip="シーン · ← →" aria-label="シーン">
      <span class="scene-ic" id="sceneIcon"></span>
      <span class="scene-nm" id="sceneName">Koi</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg>
    </button>
    <span class="dock-sep" aria-hidden="true"></span>
    <button class="icon-btn" id="btnAI" data-tip="AI · A" aria-label="AI パターン">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" data-tip="設定 · S" aria-label="設定">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button class="icon-btn" id="btnDisplay" data-tip="ディスプレイ · D" aria-label="ディスプレイ">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="12" height="9" rx="1.5"/><rect x="15" y="8" width="6.5" height="7" rx="1.2"/><path d="M6 18h5M8.5 14v4"/></svg>
    </button>
    <button class="icon-btn sound-btn" id="btnSound" data-tip="サウンド連動 · M" aria-label="サウンド連動" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 10.5v3"/></svg>
    </button>
    <button class="icon-btn" id="btnShare" data-tip="共有" aria-label="共有リンク">
      <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </button>
    <button class="icon-btn theme-btn" id="btnTheme" data-tip="テーマ · T" aria-label="ライト / ダーク">
      <svg viewBox="0 0 24 24" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <svg viewBox="0 0 24 24" class="ic-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" data-tip="全画面 · F" aria-label="全画面">
      <svg viewBox="0 0 24 24" class="ic-enter"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg viewBox="0 0 24 24" class="ic-exit"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button class="play-btn" id="btnPlay" data-tip="開始 · Space" aria-label="スクリーンセーバー開始">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
    </button>
  </nav>

  <section class="panel glass wide" id="panelScenes" aria-label="シーン" aria-hidden="true">
    <header class="panel-head">
      <h2>シーン</h2>
      <button class="close-btn" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="field" style="--i:0">
      <div class="label pic-head">Pictures
        <div class="seg small" id="picColorSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="original">元の色</button>
          <button class="seg-btn txt" data-v="palette">パレット</button>
        </div>
      </div>
      <div class="scene-grid" id="picGrid"></div>
      <input type="file" id="picInput" accept="image/*" multiple hidden>
    </div>
    <div class="field" style="--i:0">
      <div class="label">Objects</div>
      <div class="scene-grid" data-group="objects"></div>
    </div>
    <div class="field" style="--i:0">
      <div class="label">Satin</div>
      <div class="scene-grid" data-group="satin"></div>
    </div>
    <div class="field" style="--i:0">
      <div class="label">Sound</div>
      <div class="scene-grid" data-group="sound"></div>
    </div>
    <div class="field" style="--i:0">
      <div class="label">Motion</div>
      <div class="scene-grid" data-group="motion"></div>
    </div>
    <div class="field" style="--i:0">
      <div class="label">Forms</div>
      <div class="scene-grid" data-group="forms"></div>
    </div>
    <div class="field" style="--i:1">
      <div class="label">Orbits</div>
      <div class="scene-grid" data-group="orbits"></div>
    </div>
    <div class="field" style="--i:1">
      <div class="label">Lines</div>
      <div class="scene-grid" data-group="lines"></div>
    </div>
    <div class="field" style="--i:2">
      <div class="label">Op-art</div>
      <div class="scene-grid" data-group="opart"></div>
    </div>
    <div class="field" style="--i:2">
      <div class="label">Studio</div>
      <div class="scene-grid" data-group="studio"></div>
    </div>
    <div class="field" style="--i:2">
      <div class="label">Classic</div>
      <div class="scene-grid" data-group="classic"></div>
    </div>
    <div class="field" style="--i:2" id="aiScenesField" hidden>
      <div class="label">AI</div>
      <div class="scene-grid" id="aiSceneGrid"></div>
    </div>
  </section>

  <section class="panel glass" id="panelSettings" aria-label="設定" aria-hidden="true">
    <header class="panel-head">
      <h2>設定</h2>
      <button class="close-btn" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="field" style="--i:0">
      <div class="label">テーマ</div>
      <div class="seg small" id="themeSeg">
        <span class="seg-ind" aria-hidden="true"></span>
        <button class="seg-btn txt" data-v="auto">自動</button>
        <button class="seg-btn txt" data-v="light">ライト</button>
        <button class="seg-btn txt" data-v="dark">ダーク</button>
      </div>
    </div>
    <div class="field" style="--i:1">
      <div class="label">パレット</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field" style="--i:2">
      <div class="label">レンダリング</div>
      <div class="two">
        <div class="seg small" id="styleSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="halftone">ハーフトーン</button>
          <button class="seg-btn txt" data-v="dither">ディザ</button>
        </div>
        <div class="seg small shape" id="shapeSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn" data-v="circle" aria-label="円"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg></button>
          <button class="seg-btn" data-v="square" aria-label="四角"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/></svg></button>
        </div>
      </div>
    </div>
    <div class="field" style="--i:3">
      <label class="label" for="cell">ドット<output id="cellOut"></output></label>
      <input type="range" id="cell" min="10" max="24" step="1">
    </div>
    <div class="field" style="--i:4">
      <label class="label" for="speed">速度<output id="speedOut"></output></label>
      <input type="range" id="speed" min="0.2" max="2.5" step="0.1">
    </div>
    <div class="field" style="--i:5">
      <label class="toggle"><span>サウンド連動</span><input type="checkbox" id="optSound"><i></i></label>
      <div class="two sound-opts">
        <div class="seg small" id="soundSrcSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="system">PC の音</button>
          <button class="seg-btn txt" data-v="mic">マイク</button>
        </div>
        <div class="seg small sizes" id="reactSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="0.5">弱</button>
          <button class="seg-btn txt" data-v="1">中</button>
          <button class="seg-btn txt" data-v="1.6">強</button>
        </div>
      </div>
    </div>
    <div class="field" style="--i:5">
      <div class="label">時計</div>
      <div class="clock-grid" id="clockGrid"></div>
      <div class="two clock-place">
        <div class="seg small" id="clockPosSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="bl">左下</button>
          <button class="seg-btn txt" data-v="center">中央</button>
          <button class="seg-btn txt" data-v="br">右下</button>
        </div>
        <div class="seg small sizes" id="clockSizeSeg">
          <span class="seg-ind" aria-hidden="true"></span>
          <button class="seg-btn txt" data-v="s">S</button>
          <button class="seg-btn txt" data-v="m">M</button>
          <button class="seg-btn txt" data-v="l">L</button>
        </div>
      </div>
    </div>
    <div class="field" style="--i:6">
      <div class="label">自動起動</div>
      <div class="seg small" id="idleSeg">
        <span class="seg-ind" aria-hidden="true"></span>
        <button class="seg-btn txt" data-v="0">Off</button>
        <button class="seg-btn txt" data-v="1">1分</button>
        <button class="seg-btn txt" data-v="3">3分</button>
        <button class="seg-btn txt" data-v="5">5分</button>
        <button class="seg-btn txt" data-v="10">10分</button>
      </div>
    </div>
    <div class="field toggles" style="--i:7">
      <label class="toggle"><span>全画面で開始</span><input type="checkbox" id="optFull"><i></i></label>
      <label class="toggle"><span>インタラクション</span><input type="checkbox" id="optInteract"><i></i></label>
    </div>
    <div class="field" style="--i:8">
      <button class="ghost-btn" id="btnReset">リセット</button>
    </div>
  </section>

  <section class="panel glass" id="panelDisplay" aria-label="ディスプレイ" aria-hidden="true">
    <header class="panel-head">
      <h2>ディスプレイ</h2>
      <button class="close-btn" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="field" style="--i:0">
      <div class="screens" id="screens"></div>
      <div class="screen-actions">
        <button class="ghost-btn" id="btnDetect">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>ディスプレイを検出</span>
        </button>
        <button class="ghost-btn" id="btnOpenWindow">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span>表示用ウィンドウ</span>
        </button>
      </div>
    </div>
    <div class="field toggles" style="--i:1">
      <label class="toggle"><span>画面スリープ防止</span><input type="checkbox" id="optWake"><i></i></label>
      <label class="toggle"><span>焼き付き防止</span><input type="checkbox" id="optBurnin"><i></i></label>
      <label class="toggle"><span>省電力 30fps</span><input type="checkbox" id="optEco"><i></i></label>
    </div>
  </section>

  <section class="panel glass" id="panelAI" aria-label="AI パターン" aria-hidden="true">
    <header class="panel-head">
      <h2>AI パターン</h2>
      <button class="close-btn" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <form id="aiForm" class="field ai-form" style="--i:0" autocomplete="off">
      <input id="aiInput" type="text" maxlength="120" placeholder="夜の桜" aria-label="テーマ">
      <button type="submit" class="primary-btn" id="aiSubmit"><span>生成</span><i class="spinner" aria-hidden="true"></i></button>
    </form>
    <div class="field chips" id="aiChips" style="--i:1">
      <button type="button" class="chip">深海</button>
      <button type="button" class="chip">桜吹雪</button>
      <button type="button" class="chip">オーロラ</button>
      <button type="button" class="chip">心拍</button>
      <button type="button" class="chip">砂漠の夕暮れ</button>
      <button type="button" class="chip">銀河</button>
    </div>
    <div class="field ai-result" id="aiResult" style="--i:2"></div>
  </section>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="display-bar glass" id="displayBar" aria-label="表示コントロール">
  <button class="icon-btn" id="dbPrev" aria-label="前のシーン"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="icon-btn" id="dbNext" aria-label="次のシーン"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button class="icon-btn" id="dbFull" aria-label="全画面">
    <svg viewBox="0 0 24 24" class="ic-enter"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg viewBox="0 0 24 24" class="ic-exit"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
  <button class="icon-btn" id="dbClose" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</body>
</html>
